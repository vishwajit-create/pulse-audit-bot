services:
  - type: web
    name: pulse-audit-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AUDIT_LOGS_URL
        value: https://pulse-chat-x187.onrender.com/api/admin/audit-logs?key=a582bada4cc1da841b5a851cba3e1809
      - key: POLL_INTERVAL_SECONDS
        value: "15"
